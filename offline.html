<title>Нет соединения · Bolashak · тестовая версия</title>
<style>
:root{--ind:#384899;--deep:#27346f;--sun:#FFC629;--ink:#0e1230;--mute:#5b6178;--line:#dfe3ef;--paper:#f3f5fb;--soft:#c9d0ee}
*{box-sizing:border-box}html,body{margin:0}
body{background:#fff;color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column}
.head{background:var(--ind);color:#fff;padding:28px 20px 32px}
.wrap{max-width:960px;margin:0 auto;width:100%}
h1{margin:0 0 8px;font-size:clamp(26px,5vw,40px);line-height:1.15}
.head p{margin:0;color:#dfe4ff;max-width:62ch}
main{flex:1;padding:24px 20px 40px}
.card{border:1px solid var(--line);border-radius:12px;padding:clamp(16px,3vw,28px);display:grid;gap:14px;min-width:0}
.task{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-weight:600}
.task b{padding:6px 12px;border-radius:12px;background:var(--ind);color:#fff}
.task b.goal{background:var(--sun);color:var(--ink)}
.task i{font-style:normal;color:var(--mute)}
.task .sum{margin-left:auto;color:var(--mute)}
.hint{margin:0;color:var(--mute);font-size:15px}
svg{display:block;width:100%;height:auto;background:var(--paper);border-radius:12px;touch-action:manipulation}
.road{stroke:#b9c0da;stroke-width:2}
.road.can{stroke:var(--ind);stroke-width:2.5}
.km rect{fill:#fff}.km text{font:600 14px system-ui,sans-serif;fill:var(--mute);text-anchor:middle}
.city{cursor:pointer;outline:none}
.city rect{fill:#fff;stroke:var(--ink);stroke-width:2.5}
.city .ring{fill:none;stroke:transparent;stroke-width:3}
.city text{font:600 15px system-ui,sans-serif;fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
.city.on rect{fill:var(--ind);stroke:var(--ind)}
.city.goal rect{fill:var(--sun);stroke:var(--ink)}
.city.can .ring{stroke:var(--sun)}
.city:focus-visible .ring{stroke:var(--ink)}
.city.miss{animation:miss .3s}
@keyframes miss{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.mine{stroke:var(--ind);stroke-width:6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:fly .45s ease-out forwards}
.best{stroke:var(--sun);stroke-width:6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:fly .6s ease-out forwards}
.seen{stroke:var(--soft);stroke-width:5;stroke-linecap:round}
@keyframes fly{to{stroke-dashoffset:0}}
.tag rect{fill:var(--ink)}.tag text{font:700 13px system-ui,sans-serif;fill:#fff;text-anchor:middle}
.tag{animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(4px)}}
.result{display:none;gap:10px;background:var(--paper);border-radius:12px;padding:14px 16px}
.result.show{display:grid}
.result p{margin:0}.result strong{font-size:18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.score{color:var(--mute);font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:10px}
button{font:600 16px/24px system-ui,sans-serif;padding:12px 20px;border-radius:12px;border:1px solid transparent;cursor:pointer}
.go{background:var(--ink);color:#fff}.go:hover{background:var(--ind)}
.ghost{background:#fff;border-color:var(--line);color:var(--ink)}.ghost:hover{border-color:var(--ind);color:var(--ind)}
.result .ghost{justify-self:start}
@media(max-width:600px){
  .head{padding:16px 16px 18px}h1{font-size:24px;margin-bottom:4px}.head p{font-size:15px}main{padding:14px 12px 24px}.card{padding:12px;gap:10px}
  .task{font-size:14px;gap:6px}.yl{display:none}.card{gap:8px}.hint{line-height:1.4}.task b{padding:3px 9px}.hint{font-size:14px}
  .btns{display:grid;grid-template-columns:1fr 1fr}.btns .go{grid-column:1/-1}.btns button{width:100%;padding:10px 12px;font-size:15px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.mine,.best{stroke-dashoffset:0}}

<body><div role="note" style="background:#1B2350;color:#C9CFEA;font:400 12px/16px system-ui,sans-serif;padding:4px 16px;text-align:center"><style>.tn{display:none}:root[lang=ru] .tn-ru,:root[lang=kk] .tn-kz,:root[lang=en] .tn-en{display:inline}</style><span class="tn tn-ru">Тестовая версия редизайна. Это не официальный сайт. Официальный сайт: </span><span class="tn tn-kz">Қайта безендірудің сынақ нұсқасы. Бұл ресми сайт емес. Ресми сайт: </span><span class="tn tn-en">Test version of a redesign. This is not the official site. Official site: </span>bolashak.gov.kz</div>
<header class="head"><div class="wrap"><h1 data-t="title">Нет соединения</h1><p data-t="lead"></p></div></header>
<main><div class="wrap card">
  <div class="task" id="task" aria-live="polite"></div>
  <p class="hint" data-t="hint"></p>
  <svg id="map" viewBox="0 0 920 490" role="group"></svg>

  <div class="row"><span class="score" id="score"></span><span class="btns"><button class="ghost" id="again" type="button" data-t="again"></button><button class="ghost" id="skip" type="button" data-t="skip"></button><button class="go" id="retry" type="button" data-t="retry"></button></span></div>
</div></main>
<script>
(() => {
  const L = (location.pathname.match(/\/(ru|kz|en)(\/|$)/) || [, 'ru'])[1]
  const T = {
    ru: { title: 'Нет соединения', lead: 'Нужная страница откроется сама, как только интернет вернётся.', hint: 'А пока задача: долетите из Астаны в жёлтый город самым коротким путём. Нажимайте города, соединённые линией. Числа на линиях: тысячи километров.', yours: 'Ваш путь', unit: 'тыс. км', best: 'Это самый короткий путь. Отлично!', longer: 'Есть путь короче', how: 'Как ищет компьютер', explain: 'Компьютер не угадывает. Он идёт от Астаны во все стороны и всегда сначала проверяет самый близкий город. Число у города: самый короткий путь до него. Когда очередь доходит до цели, ответ готов. Так ищут дорогу навигаторы, и с таких задач начинают изучать искусственный интеллект.', again: 'Начать заново', skip: 'Другой маршрут', retry: 'Открыть страницу снова', still: 'Интернета пока нет', score: 'Самых коротких путей', map: 'Карта городов' },
    kz: { title: 'Байланыс жоқ', lead: 'Интернет қайта қосылғанда керекті бет өзі ашылады.', hint: 'Әзірге есеп: Астанадан сары қалаға ең қысқа жолмен ұшып жетіңіз. Сызықпен жалғанған қалаларды басыңыз. Сызықтағы сандар: мың шақырым.', yours: 'Сіздің жолыңыз', unit: 'мың км', best: 'Бұл ең қысқа жол. Тамаша!', longer: 'Бұдан қысқа жол бар', how: 'Компьютер қалай іздейді', explain: 'Компьютер болжамайды. Ол Астанадан барлық бағытқа тарайды және әрқашан алдымен ең жақын қаланы тексереді. Қала жанындағы сан: оған дейінгі ең қысқа жол. Кезек мақсатқа жеткенде жауап дайын. Навигаторлар жолды осылай іздейді, жасанды интеллектті оқу да осындай есептерден басталады.', again: 'Қайта бастау', skip: 'Басқа бағыт', retry: 'Бетті қайта ашу', still: 'Интернет әлі жоқ', score: 'Ең қысқа жолдар', map: 'Қалалар картасы' },
    en: { title: 'No connection', lead: 'The page you wanted will open by itself once you are back online.', hint: 'Meanwhile, a puzzle: fly from Astana to the yellow city by the shortest route. Tap cities joined by a line. Numbers on the lines are thousands of kilometres.', yours: 'Your route', unit: 'thousand km', best: 'That is the shortest route. Well done!', longer: 'There is a shorter route', how: 'How a computer searches', explain: 'A computer does not guess. It spreads out from Astana in every direction and always checks the nearest city first. The number by each city is the shortest way to it. Once the goal comes up, the answer is ready. Navigation apps find routes this way, and puzzles like this are where learning artificial intelligence begins.', again: 'Start over', skip: 'Another route', retry: 'Open the page again', still: 'Still no internet', score: 'Shortest routes found', map: 'Map of cities' },
  }[L]
  document.documentElement.lang = L === 'kz' ? 'kk' : L
  document.querySelectorAll('[data-t]').forEach((n) => (n.textContent = T[n.dataset.t]))
  document.title = T.title + ' · Bolashak'
  const svg = document.getElementById('map'); svg.setAttribute('aria-label', T.map)
  // name ru, kz, en; latitude and longitude (for real straight-line distances); x, y on the schematic 920 × 490 map; where its name sits
  const C = [
    ['Астана', 'Астана', 'Astana', 51.17, 71.45, 600, 110, 't'], ['Торонто', 'Торонто', 'Toronto', 43.65, -79.38, 85, 130, 'l'],
    ['Бостон', 'Бостон', 'Boston', 42.36, -71.06, 190, 205, 'r'], ['Нью-Йорк', 'Нью-Йорк', 'New York', 40.71, -74.01, 85, 295, 'b'],
    ['Эдинбург', 'Эдинбург', 'Edinburgh', 55.95, -3.19, 300, 60, 'r'], ['Лондон', 'Лондон', 'London', 51.51, -0.13, 315, 170, 'br'],
    ['Париж', 'Париж', 'Paris', 48.86, 2.35, 290, 305, 'b'], ['Цюрих', 'Цюрих', 'Zurich', 47.37, 8.54, 430, 335, 'b'],
    ['Берлин', 'Берлин', 'Berlin', 52.52, 13.4, 455, 150, 't'], ['Пекин', 'Бейжің', 'Beijing', 39.9, 116.41, 720, 205, 'l'],
    ['Сеул', 'Сеул', 'Seoul', 37.57, 126.98, 800, 90, 't'], ['Токио', 'Токио', 'Tokyo', 35.68, 139.69, 840, 235, 'r'],
    ['Сингапур', 'Сингапур', 'Singapore', 1.35, 103.82, 680, 380, 'l'], ['Сидней', 'Сидней', 'Sydney', -33.87, 151.21, 840, 405, 'r'],
    ['Мельбурн', 'Мельбурн', 'Melbourne', -37.81, 144.96, 750, 455, 'l'],
  ]
  const id = Object.fromEntries(C.map((c, i) => [c[2], i]))
  const E = [['Toronto', 'Boston'], ['Boston', 'New York'], ['Toronto', 'New York'], ['Edinburgh', 'Toronto'], ['London', 'Boston'], ['Paris', 'New York'],
    ['Edinburgh', 'London'], ['London', 'Paris'], ['London', 'Berlin'], ['Paris', 'Zurich'], ['Zurich', 'Berlin'], ['Berlin', 'Astana'], ['Zurich', 'Astana'],
    ['Astana', 'Beijing'], ['Astana', 'Seoul'], ['Astana', 'Singapore'], ['Beijing', 'Seoul'], ['Seoul', 'Tokyo'], ['Beijing', 'Tokyo'], ['Beijing', 'Singapore'],
    ['Singapore', 'Sydney'], ['Singapore', 'Melbourne'], ['Tokyo', 'Sydney'], ['Sydney', 'Melbourne']]
    .map(([a, b]) => [id[a], id[b]])
  const ix = { ru: 0, kz: 1, en: 2 }[L]
  const rad = (d) => (d * Math.PI) / 180
  const km = (a, b) => { const [p, q] = [C[a], C[b]]; const h = Math.sin(rad(q[3] - p[3]) / 2) ** 2 + Math.cos(rad(p[3])) * Math.cos(rad(q[3])) * Math.sin(rad(q[4] - p[4]) / 2) ** 2; return Math.round((2 * 6371 * Math.asin(Math.sqrt(h))) / 100) / 10 }
  const W = E.map(([a, b]) => km(a, b))
  const nb = C.map(() => []); E.forEach(([a, b], k) => { nb[a].push([b, W[k], k]); nb[b].push([a, W[k], k]) })
  const fmt = (v) => (L === 'en' ? v.toFixed(1) : v.toFixed(1).replace('.', ','))
  const ns = 'http://www.w3.org/2000/svg', el = (n, a, p) => { const e = document.createElementNS(ns, n); for (const k in a) e.setAttribute(k, a[k]); if (p) p.append(e); return e }
  // a phone gets its own upright map, so the whole map fits the screen without sideways scrolling: x, y on 410 × 550; where the name sits
  const M = { Toronto: [40, 62, 't'], Edinburgh: [190, 36, 'r'], Boston: [75, 148, 'b'], London: [190, 112, 't'], 'New York': [40, 228, 'b'], Paris: [130, 210, 'b'],
    Zurich: [215, 214, 'b'], Berlin: [305, 132, 't'], Astana: [305, 272, 'r'], Beijing: [250, 362, 'l'], Seoul: [355, 322, 'r'], Tokyo: [330, 410, 'r'],
    Singapore: [130, 420, 'l'], Sydney: [320, 500, 'r'], Melbourne: [200, 527, 'l'] }
  const phone = matchMedia('(max-width: 600px)')
  const at = (i) => (phone.matches ? M[C[i][2]] : [C[i][5], C[i][6], C[i][7]])
  const xy = (i) => at(i).slice(0, 2)
  const roads = el('g', {}, svg), trails = el('g', {}, svg), labels = el('g', {}, svg), cities = el('g', {}, svg), tags = el('g', {}, svg)
  let roadEls = [], nodes = []
  const build = () => {
    svg.setAttribute('viewBox', phone.matches ? '0 0 410 550' : '0 0 920 490')
    ;[roads, trails, labels, cities, tags].forEach((g) => (g.textContent = ''))
    roadEls = E.map(([a, b], k) => {
      const [x1, y1] = xy(a), [x2, y2] = xy(b)
      const r = el('line', { class: 'road', x1, y1, x2, y2 }, roads)
      const g = el('g', { class: 'km' }, labels)
      el('rect', { x: (x1 + x2) / 2 - 17, y: (y1 + y2) / 2 - 10, width: 34, height: 19, rx: 9 }, g)
      el('text', { x: (x1 + x2) / 2, y: (y1 + y2) / 2 + 4 }, g).textContent = fmt(W[k])
      return r
    })
    nodes = C.map((c, i) => {
      const [x, y, side] = at(i)
      const g = el('g', { class: 'city', tabindex: 0, role: 'button', 'aria-label': c[ix] }, cities)
      el('rect', { class: 'ring', x: x - 12, y: y - 12, width: 24, height: 24, rx: 5 }, g)
      el('rect', { x: x - 7, y: y - 7, width: 14, height: 14, rx: 2 }, g)
      const [dx, dy, an] = { t: [0, -16, 'middle'], b: [0, 26, 'middle'], l: [-15, 5, 'end'], r: [15, 5, 'start'], br: [12, 22, 'start'] }[side]
      el('text', { x: x + dx, y: y + dy, 'text-anchor': an }, g).textContent = c[ix]
      g.addEventListener('click', () => pick(i)); g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(i) } })
      return g
    })
  }
  const line = (a, b, cls, p) => { const [x1, y1] = xy(a), [x2, y2] = xy(b); return el('path', { class: cls, d: `M${x1} ${y1}L${x2} ${y2}`, pathLength: 1 }, p) }
  // shortest routes from the start, in the order a uniform-cost search settles the cities
  const search = (s, goal) => {
    const d = C.map(() => Infinity), prev = C.map(() => -1), done = C.map(() => false), order = []
    d[s] = 0
    for (;;) {
      let u = -1; d.forEach((v, i) => { if (!done[i] && v < Infinity && (u < 0 || v < d[u])) u = i })
      if (u < 0) break
      done[u] = true; order.push(u); if (u === goal) break
      for (const [v, w] of nb[u]) if (d[u] + w < d[v] - 1e-9) { d[v] = Math.round((d[u] + w) * 10) / 10; prev[v] = u }
    }
    const path = []; for (let v = goal; v >= 0; v = prev[v]) path.unshift(v)
    return { d, prev, order, path }
  }
  const START = id.Astana, GOALS = ['Toronto', 'Boston', 'New York', 'Edinburgh', 'London', 'Paris', 'Zurich', 'Tokyo', 'Sydney', 'Melbourne'].map((n) => id[n])
  const task = document.getElementById('task'), score = document.getElementById('score'), result = document.getElementById('result'), verdict = document.getElementById('verdict'), how = document.getElementById('how'), explain = document.getElementById('explain')
  let goal = -1, path = [], dist = 0, finished = false, timer = 0, wins = +(sessionStorage.getItem('bw-short') || 0)
  const here = () => path[path.length - 1]
  const paint = () => {
    const can = finished ? [] : nb[here()].map(([v]) => v)
    nodes.forEach((g, i) => { g.classList.toggle('on', path.includes(i)); g.classList.toggle('goal', i === goal && !path.includes(i)); g.classList.toggle('can', can.includes(i)) })
    roadEls.forEach((r, k) => r.classList.toggle('can', !finished && E[k].includes(here())))
    task.textContent = ''
    const a = document.createElement('b'); a.textContent = C[START][ix]; const i = document.createElement('i'); i.textContent = '→'; const b = document.createElement('b'); b.className = 'goal'; b.textContent = C[goal][ix]
    const s = document.createElement('span'); s.className = 'sum'; const y = document.createElement('span'); y.className = 'yl'; y.textContent = `${T.yours}: `; s.append(y, `${fmt(dist)} ${T.unit}`)
    task.append(a, i, b, s)
    score.textContent = `${T.score}: ${wins}`
  }
  const restart = () => { clearTimeout(timer); trails.textContent = ''; tags.textContent = ''; path = [START]; dist = 0; finished = false; result.classList.remove('show'); explain.hidden = true; how.hidden = false; paint() }
  const fresh = () => { const pool = GOALS.filter((g) => g !== goal); goal = pool[Math.floor(Math.random() * pool.length)]; restart() }
  const finish = () => {
    finished = true
    const best = search(START, goal)
    const ok = Math.abs(dist - best.d[goal]) < 0.05
    if (ok) { wins++; sessionStorage.setItem('bw-short', wins) }
    verdict.innerHTML = ''
    const st = document.createElement('strong'); st.textContent = ok ? T.best : `${T.longer}: ${fmt(best.d[goal])} ${T.unit}`
    verdict.append(st)
    result.classList.add('show'); paint()
  }
  const pick = (i) => {
    if (finished) return
    const at = path.indexOf(i)
    if (at >= 0) { // a city already on your route: go back to it
      if (at === path.length - 1) return
      path = path.slice(0, at + 1); trails.textContent = ''; dist = 0
      for (let k = 1; k < path.length; k++) { dist += nb[path[k - 1]].find(([v]) => v === path[k])[1]; line(path[k - 1], path[k], 'mine', trails).style.animation = 'none' }
      dist = Math.round(dist * 10) / 10; paint(); return
    }
    const hop = nb[here()].find(([v]) => v === i)
    if (!hop) { const g = nodes[i]; g.classList.remove('miss'); void g.getBBox(); g.classList.add('miss'); return }
    line(here(), i, 'mine', trails); path.push(i); dist = Math.round((dist + hop[1]) * 10) / 10
    if (i === goal) finish(); else paint()
  }
  how.onclick = () => {
    how.hidden = true; explain.hidden = false
    trails.querySelectorAll('.mine').forEach((p) => (p.style.opacity = '.35'))
    const { d, prev, order, path: best } = search(START, goal)
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches
    const tag = (u) => {
      if (prev[u] >= 0) line(prev[u], u, 'seen', trails)
      // the tag goes on the side opposite the city's name
      const [x0, y0] = xy(u), [ox, oy] = { t: [0, 20], b: [0, -20], l: [32, 0], r: [-32, 0], br: [-32, 0] }[at(u)[2]], x = x0 + ox, y = y0 + oy
      const g = el('g', { class: 'tag' }, tags)
      el('rect', { x: x - 19, y: y - 10, width: 38, height: 19, rx: 9 }, g)
      const t = el('text', { x, y: y + 5 }, g); t.textContent = fmt(d[u])
    }
    const end = () => best.slice(1).forEach((v, k) => line(best[k], v, 'best', trails))
    if (still) { order.forEach(tag); end(); return }
    let k = 0
    const step = () => { if (k < order.length) { tag(order[k++]); timer = setTimeout(step, 550) } else end() }
    step()
  }
  document.getElementById('again').onclick = restart
  document.getElementById('skip').onclick = fresh
  // try the page again; with no connection at all, say so and keep the game as it is
  const retry = document.getElementById('retry')
  retry.onclick = () => { if (navigator.onLine) return location.reload(); retry.textContent = T.still; setTimeout(() => (retry.textContent = T.retry), 2000) }
  addEventListener('online', () => location.reload())
  build(); fresh()
  phone.addEventListener('change', () => { build(); restart() })
})()
</script>
