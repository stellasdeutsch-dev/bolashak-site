<title>Нет соединения · Bolashak · тестовая версия</title>
<style>
:root{--ind:#384899;--deep:#27346F;--sun:#FFC629;--ink:#0F1535;--mute:#565D75;--line:#DDE0EC;--paper:#F4F5FB;--soft:#C9CFEA;--route:#B8BFDA}
*{box-sizing:border-box}html,body{margin:0}
body{background:#fff;color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column}
.head{background:var(--ind);color:#fff;padding:28px 20px 32px}
.wrap{max-width:980px;margin:0 auto;width:100%}
h1{margin:0 0 8px;font-size:clamp(26px,5vw,40px);line-height:1.15}
.head p{margin:0;color:#dfe4ff;max-width:62ch}
.call{margin:12px 0 0;color:#dfe4ff}.call a{color:#fff;font-weight:700}
main{flex:1;padding:24px 20px 40px}
.card{border:1px solid var(--line);border-radius:16px;padding:clamp(16px,3vw,28px);display:grid;gap:16px;min-width:0}
.task{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-weight:700}
.task b{padding:6px 12px;border-radius:999px;background:var(--ind);color:#fff;font-weight:700}
.task b.goal{background:var(--sun);color:var(--ink)}
.task i{font-style:normal;color:var(--mute)}
.hint{margin:0;color:var(--mute);font-size:15px;max-width:40em}
/* the map: a quiet dotted ground, routes as arcs like an airline route map */
.map{position:relative;border-radius:14px;background:var(--paper) radial-gradient(circle,#dfe3f1 1px,transparent 1.3px) 0 0/18px 18px;overflow:hidden}
svg{display:block;width:100%;height:auto;touch-action:manipulation}
.road{fill:none;stroke:var(--route);stroke-width:1.5;stroke-linecap:round}
.road.can{stroke:var(--ind);stroke-width:2.2}
.km{font:600 12px system-ui,sans-serif;fill:#7d84a0;text-anchor:middle;paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.km.can{fill:var(--ind);font-weight:800;font-size:13px}
.city{cursor:pointer;outline:none}
.city .hit{fill:transparent}
.city .dot{fill:#fff;stroke:var(--ink);stroke-width:2}
.city .halo{fill:var(--ind);opacity:0}
.city .ring{fill:none;stroke:transparent;stroke-width:2}
.city text{font:600 14px system-ui,sans-serif;fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
.city.can .dot{stroke:var(--ind);stroke-width:2.5}
.city.can .ring{stroke:var(--ind);opacity:.35}
.city.on .dot{fill:var(--ind);stroke:var(--ind)}
.city.here .halo{opacity:.16}
.city.here .dot{fill:var(--ind);stroke:#fff;stroke-width:2.5}
.city.goal text,.city.here text{font-weight:800}
.city:focus-visible .ring{stroke:var(--ink);opacity:1;stroke-width:2.5}
.city:hover .ring{stroke:var(--ind);opacity:.6}
.city.miss{animation:miss .3s}
@keyframes miss{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.can .ring{animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{opacity:.08}}
.pin path{fill:var(--sun);stroke:var(--ink);stroke-width:1.5}.pin circle{fill:var(--ink)}
.mine{fill:none;stroke:var(--ind);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:fly .6s ease-in-out forwards}
.best{fill:none;stroke:var(--sun);stroke-width:5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:fly .7s ease-in-out forwards}
.seen{fill:none;stroke:var(--soft);stroke-width:4;stroke-linecap:round}
@keyframes fly{to{stroke-dashoffset:0}}
.plane path{fill:var(--ind);stroke:#fff;stroke-width:1.2;stroke-linejoin:round}
.tag rect{fill:var(--ink)}.tag text{font:700 11px system-ui,sans-serif;fill:#fff;text-anchor:middle}
.tag{animation:pop .25s ease-out}
@keyframes pop{from{opacity:0}}
/* your route as a chain under the map */
.trip{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px;font-weight:600;min-height:28px}
.trip .c{padding:2px 10px;border-radius:999px;background:var(--paper)}
.trip .c.goal{background:var(--sun)}
.trip .leg{color:var(--mute);font-size:13px;font-weight:600;padding:0 2px;white-space:nowrap}
.trip .leg::before{content:"";display:inline-block;width:14px;height:2px;background:var(--route);vertical-align:middle;margin-right:4px}
.trip .sum{margin-left:auto;font-weight:800}
.result{display:none;gap:10px;background:var(--paper);border-radius:12px;padding:14px 16px}
.result.show{display:grid}
.result p{margin:0}.result strong{font-size:18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.score{color:var(--mute);font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:10px}
button{font:600 16px/24px system-ui,sans-serif;padding:12px 20px;border-radius:12px;border:1px solid transparent;cursor:pointer}
button:focus-visible{outline:3px solid var(--ind);outline-offset:2px}
.go{background:var(--ink);color:#fff}.go:hover{background:var(--ind)}
.head .go{margin-top:16px;background:var(--sun);color:var(--ink)}.head .go:hover{background:#FFD65C}.head .go:focus-visible{outline-color:#fff}
.ghost{background:#fff;border-color:var(--line);color:var(--ink)}.ghost:hover{border-color:var(--ind);color:var(--ind)}
.result .ghost{justify-self:start}
@media(max-width:600px){
  .head{padding:16px 16px 18px}h1{font-size:24px;margin-bottom:4px}.head p{font-size:15px}main{padding:14px 12px 24px}.card{padding:12px;gap:10px}
  .task{font-size:14px;gap:6px}.task b{padding:3px 10px}.hint{font-size:14px;line-height:1.4}
  .trip{font-size:14px}.trip .sum{margin-left:0;width:100%}
  .btns{display:grid;grid-template-columns:1fr 1fr;width:100%}.btns button{width:100%;padding:10px 12px;font-size:15px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.mine,.best{stroke-dashoffset:0}}

    requestAnimationFrame(step)
  }
  const line = (a, b, cls, p) => el('path', { class: cls, d: arc(a, b).d, pathLength: 1 }, p)
  // shortest routes from the start, in the order a uniform-cost search settles the cities
  const search = (s, goal) => {
    const d = C.map(() => Infinity), prev = C.map(() => -1), done = C.map(() => false), order = []
    d[s] = 0
    for (;;) {
      let u = -1; d.forEach((v, i) => { if (!done[i] && v < Infinity && (u < 0 || v < d[u])) u = i })
      if (u < 0) break
      done[u] = true; order.push(u); if (u === goal) break
      for (const [v, w] of nb[u]) if (d[u] + w < d[v] - 1e-9) { d[v] = Math.round((d[u] + w) * 10) / 10; prev[v] = u }
    }
    const path = []; for (let v = goal; v >= 0; v = prev[v]) path.unshift(v)
    return { d, prev, order, path }
  }
  const START = id.Astana, GOALS = ['Toronto', 'Boston', 'New York', 'Edinburgh', 'London', 'Paris', 'Zurich', 'Tokyo', 'Sydney', 'Melbourne'].map((n) => id[n])
  const task = document.getElementById('task'), score = document.getElementById('score'), result = document.getElementById('result'), verdict = document.getElementById('verdict'), how = document.getElementById('how'), explain = document.getElementById('explain')
  let goal = -1, path = [], dist = 0, finished = false, timer = 0, wins = +(sessionStorage.getItem('bw-short') || 0)
  const here = () => path[path.length - 1]
  const trip = document.getElementById('trip')
  const paint = () => {
    const can = finished ? [] : nb[here()].map(([v]) => v)
    nodes.forEach((g, i) => {
      g.classList.toggle('on', path.includes(i)); g.classList.toggle('here', i === here()); g.classList.toggle('goal', i === goal); g.classList.toggle('can', can.includes(i))
      const st = [i === here() ? T.stHere : path.includes(i) ? T.stOn : '', i === goal ? T.stGoal : '', can.includes(i) ? T.stCan : i !== here() && !finished ? T.stNo : ''].filter(Boolean)
      g.setAttribute('aria-label', [C[i][ix], ...st].join(', '))
      if (i === here()) g.setAttribute('aria-current', 'location'); else g.removeAttribute('aria-current')
      g.setAttribute('aria-disabled', String(!can.includes(i)))
    })
    roadEls.forEach((r, k) => r.classList.toggle('can', !finished && E[k].includes(here())))
    kmEls.forEach((t, k) => t.classList.toggle('can', !finished && E[k].includes(here())))
    task.textContent = ''
    const a = document.createElement('b'); a.textContent = C[START][ix]; const i = document.createElement('i'); i.textContent = '→'; const b = document.createElement('b'); b.className = 'goal'; b.textContent = C[goal][ix]
    task.append(a, i, b)
    // the route so far as a chain: city, distance, city…
    trip.textContent = ''
    path.forEach((c, k) => {
      if (k) { const leg = document.createElement('span'); leg.className = 'leg'; leg.textContent = fmt(nb[path[k - 1]].find(([v]) => v === c)[1]); trip.append(leg) }
      const n = document.createElement('span'); n.className = 'c' + (c === goal ? ' goal' : ''); n.textContent = C[c][ix]; trip.append(n)
    })
    const sum = document.createElement('span'); sum.className = 'sum'; sum.textContent = `${T.yours}: ${fmt(dist)} ${T.unit}`; trip.append(sum)
    score.textContent = `${T.score}: ${wins}`
  }
  const restart = () => { clearTimeout(timer); trails.textContent = ''; tags.textContent = ''; sky.textContent = ''; placePin(); path = [START]; dist = 0; finished = false; result.classList.remove('show'); explain.hidden = true; how.hidden = false; paint() }
  const fresh = () => { const pool = GOALS.filter((g) => g !== goal); goal = pool[Math.floor(Math.random() * pool.length)]; restart() }
  const finish = () => {
    finished = true
    const best = search(START, goal)
    const ok = Math.abs(dist - best.d[goal]) < 0.05
    if (ok) { wins++; sessionStorage.setItem('bw-short', wins) }
    verdict.innerHTML = ''
    const st = document.createElement('strong'); st.textContent = ok ? T.best : `${T.longer}: ${fmt(best.d[goal])} ${T.unit}`
    verdict.append(st)
    result.classList.add('show'); paint()
  }
  const pick = (i) => {
    if (finished) return
    const at = path.indexOf(i)
    if (at >= 0) { // a city already on your route: go back to it
      if (at === path.length - 1) return
      path = path.slice(0, at + 1); trails.textContent = ''; dist = 0
      for (let k = 1; k < path.length; k++) { dist += nb[path[k - 1]].find(([v]) => v === path[k])[1]; line(path[k - 1], path[k], 'mine', trails).style.animation = 'none' }
      dist = Math.round(dist * 10) / 10; paint(); return
    }
    const hop = nb[here()].find(([v]) => v === i)
    if (!hop) { const g = nodes[i]; g.classList.remove('miss'); void g.getBBox(); g.classList.add('miss'); return }
    fly(line(here(), i, 'mine', trails)); path.push(i); dist = Math.round((dist + hop[1]) * 10) / 10
    if (i === goal) finish(); else paint()
  }
  how.onclick = () => {
    how.hidden = true; explain.hidden = false
    trails.querySelectorAll('.mine').forEach((p) => (p.style.opacity = '.35'))
    const { d, prev, order, path: best } = search(START, goal)
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches
    const tag = (u) => {
      if (prev[u] >= 0) line(prev[u], u, 'seen', trails)
      // the tag goes on the side opposite the city's name
      const [x0, y0] = xy(u), [ox, oy] = { t: [0, 22], b: [0, -22], l: [30, 0], r: [-30, 0], br: [-30, 0] }[at(u)[2]], x = x0 + ox, y = y0 + oy
      const g = el('g', { class: 'tag' }, tags)
      el('rect', { x: x - 17, y: y - 9, width: 34, height: 18, rx: 9 }, g)
      const t = el('text', { x, y: y + 4 }, g); t.textContent = fmt(d[u])
    }
    const end = () => best.slice(1).forEach((v, k) => line(best[k], v, 'best', trails))
    if (still) { order.forEach(tag); end(); return }
    let k = 0
    const step = () => { if (k < order.length) { tag(order[k++]); timer = setTimeout(step, 550) } else end() }
    step()
  }
  document.getElementById('again').onclick = restart
  document.getElementById('skip').onclick = fresh
  // try the page again; with no connection at all, say so and keep the game as it is
  const retry = document.getElementById('retry')
  retry.onclick = () => { if (navigator.onLine) return location.reload(); retry.textContent = T.still; setTimeout(() => (retry.textContent = T.retry), 2000) }
  addEventListener('online', () => location.reload())
  build(); fresh()
  phone.addEventListener('change', () => { build(); restart() })
})()
</script>
